<html lang="vi">
<head>

  <meta name="keywords" content="QR Code, mã QR, tạo QR miễn phí, QR generator, QR code online">
  <meta name="robots" content="index,follow">

  <meta property="og:description" content="Tạo mã QR miễn phí cho liên kết, văn bản hoặc email với công cụ trực tuyến hỗ trợ tùy chỉnh màu sắc, kích thước và tải PNG ngay lập tức.">

  <style>
    :root {
      --bg-color-light: #f0f4f9;
      --bg-color-dark: #1a202c;
      --glass-bg-light: rgba(255, 255, 255, 0.7);
      --glass-bg-dark: rgba(45, 55, 72, 0.7);
      --border-color-light: rgba(203, 213, 225, 0.5);
      --border-color-dark: rgba(255, 255, 255, 0.1);
      --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      --shadow-dark: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --text-color-light: #1f2933;
      --text-color-dark: #f7fafc;
      --primary-accent: #3b82f6;
      --secondary-accent: #10b981;

      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background: var(--bg-color-light);
      color: var(--text-color-light);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: var(--bg-color-dark);
        color: var(--text-color-dark);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
    }

    .app {
      width: min(1024px, 100%);
      background: var(--glass-bg-light);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 1rem;
      border: 1px solid var(--border-color-light);
      box-shadow: var(--shadow-light);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (prefers-color-scheme: dark) {
      .app {
        background: var(--glass-bg-dark);
        border: 1px solid var(--border-color-dark);
        box-shadow: var(--shadow-dark);
      }
    }

    header {
      padding: 1.75rem 2rem;
      background: rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid var(--border-color-light);
      color: var(--text-color-light);
    }

    @media (prefers-color-scheme: dark) {
      header {
        border-bottom: 1px solid var(--border-color-dark);
        color: var(--text-color-dark);
      }
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }
    header p {
      margin: 0;
      opacity: 0.9;
      font-size: clamp(0.9rem, 2vw, 1rem);
    }

    main {
      display: grid;
      gap: 1.5rem;
      padding: 2rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      main {
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
    }

    form {
      display: grid;
      gap: 1.25rem;
    }
    .field {
      display: grid;
      gap: 0.75rem;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      border-radius: 0.75rem;
      border: 1px solid var(--border-color-light);
      padding: 0.75rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: rgba(255, 255, 255, 0.5);
      color: var(--text-color-light);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary-accent);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      input[type="text"],
      input[type="email"],
      input[type="number"],
      select,
      textarea {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color-dark);
        color: var(--text-color-dark);
      }
    }

    .radio-group {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    }

    .radio-card {
      border-radius: 0.75rem;
      border: 1px solid var(--border-color-light);
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-card:hover {
      border-color: var(--primary-accent);
      background: rgba(59, 130, 246, 0.1);
    }

    .radio-card input {
      accent-color: var(--primary-accent);
      margin: 0;
    }

    .radio-card.active {
      border-color: var(--primary-accent);
      background: rgba(59, 130, 246, 0.2);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .options-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .color-picker > div {
      display: grid;
      gap: 0.25rem;
    }

    input[type="color"] {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--border-color-light);
      padding: 0;
      background: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    input[type="color"]:hover {
        transform: scale(1.1);
    }

    .qr-preview {
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--border-color-light);
      padding: 1.5rem;
      display: grid;
      gap: 1.25rem;
      align-content: start;
      text-align: center;
    }

    .qr-preview h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .qr-canvas-wrapper {
      justify-self: center;
      overflow: auto;
      max-width: 100%;
      border-radius: 1rem;
      box-shadow: var(--shadow-light);
    }

    #qrCanvas {
      justify-self: center;
      border-radius: 1rem;
      background-color: #fff;
      padding: 1rem;
    }

    button {
      border: none;
      border-radius: 0.75rem;
      padding: 1rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-accent);
      color: white;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
    }
    .btn-primary:hover {
      background: #3575df;
      box-shadow: 0 6px 20px 0 rgba(59, 130, 246, 0.45);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border-color-light);
      color: var(--text-color-light);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
    }

    .helper {
      font-size: 0.8rem;
      color: #63748a;
    }

    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-top: 1px solid var(--border-color-light);
      font-size: 0.9rem;
      color: var(--text-color-light);
    }

    @media (prefers-color-scheme: dark) {
      .helper { color: #a0aec0; }
      footer {
        border-top: 1px solid var(--border-color-dark);
        color: var(--text-color-dark);
      }
    }

    @media (max-width: 767px) {
      body { padding: 0; }
      .app {
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
        border: none;
      }
      header, main, footer {
        padding-inline: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Tạo QR Code miễn phí</h1>
      <p>Chọn loại nội dung, điều chỉnh màu sắc và tải ngay mã QR chất lượng cao.</p>
    </header>
    <main>
      <form id="qrForm">
        <section class="field">
          <label>Loại nội dung</label>
          <div class="radio-group" id="contentTypeGroup">
            <label class="radio-card active">
              <input type="radio" name="contentType" value="url" checked>
              <span>Liên kết (URL)</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="contentType" value="text">
              <span>Văn bản</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="contentType" value="email">
              <span>Email</span>
            </label>
          </div>
        </section>

        <section id="urlFields" class="field">
          <label for="urlInput">Địa chỉ liên kết</label>
          <input id="urlInput" name="url" type="text" placeholder="https://..." required>
          <p class="helper">Ví dụ: https://example.com</p>
        </section>

        <section id="textFields" class="field" hidden>
          <label for="textInput">Nội dung văn bản</label>
          <textarea id="textInput" name="text" placeholder="Nhập tin nhắn hoặc ghi chú" disabled></textarea>
        </section>

        <section id="emailFields" class="field" hidden>
          <label for="emailAddress">Địa chỉ email</label>
          <input id="emailAddress" name="emailAddress" type="email" placeholder="email@domain.com" disabled>
          <label for="emailSubject">Tiêu đề</label>
          <input id="emailSubject" name="emailSubject" type="text" placeholder="Chủ đề email" disabled>
          <label for="emailBody">Nội dung</label>
          <textarea id="emailBody" name="emailBody" placeholder="Nội dung email" disabled></textarea>
        </section>

        <section class="field">
          <label>Cài đặt QR</label>
          <div class="options-grid">
            <div>
              <span class="helper">Kích thước (px)</span>
              <input id="sizeInput" name="size" type="number" min="150" max="800" value="320">
            </div>
            <div>
              <span class="helper">Viền trắng</span>
              <select id="marginSelect" name="margin">
                <option value="1">Nhỏ</option>
                <option value="2" selected>Trung bình</option>
                <option value="4">Rộng</option>
                <option value="0">Không viền</option>
              </select>
            </div>
            <div class="color-picker">
              <input id="foregroundColor" type="color" value="#0f172a">
              <div>
                <span class="helper">Màu mã QR</span>
                <strong id="fgColorCode">#0f172a</strong>
              </div>
            </div>
            <div class="color-picker">
              <input id="backgroundColor" type="color" value="#ffffff">
              <div>
                <span class="helper">Nền mã QR</span>
                <strong id="bgColorCode">#ffffff</strong>
              </div>
            </div>
          </div>
        </section>

        <section class="field">
          <button type="submit" class="btn-primary">Tạo mã QR</button>
        </section>
      </form>

      <section class="qr-preview">
        <h2>Xem trước</h2>
        <div class="qr-canvas-wrapper">
          <canvas id="qrCanvas" width="320" height="320" aria-label="QR code preview"></canvas>
        </div>
        <button id="downloadBtn" class="btn-secondary" type="button" disabled>Tải về PNG</button>
      </section>
    </main>
    <footer>
      Cập nhật tự động khi bạn thay đổi nội dung. Không cần tài khoản, hoàn toàn miễn phí.
    </footer>
  </div>

  <script>
    /* QRCode generation using minimal dependency-free algorithm based on https://github.com/soldair/node-qrcode.
       To keep file self-contained, we embed a compact QR generator adapted from qrcode.js (MIT License). */

    (function updateSeoMetadata() {
      var url = new URL(window.location.href);
      var canonicalHref = url.origin + url.pathname;
      if (canonicalHref.endsWith("index.html")) {
        canonicalHref = canonicalHref.slice(0, -10);
        if (!canonicalHref.endsWith("/")) canonicalHref += "/";
      }
      var canonicalLink = document.getElementById("canonicalLink");
      if (canonicalLink) canonicalLink.setAttribute("href", canonicalHref);
      var ogUrlMeta = document.querySelector('meta[property="og:url"]');
      if (ogUrlMeta) ogUrlMeta.setAttribute("content", canonicalHref);
      var seoImageUrl = new URL("og-image.svg", canonicalHref).href;
      var ogImageMeta = document.querySelector('meta[property="og:image"]');
      if (ogImageMeta) ogImageMeta.setAttribute("content", seoImageUrl);
      var twitterImageMeta = document.querySelector('meta[name="twitter:image"]');
      if (twitterImageMeta) twitterImageMeta.setAttribute("content", seoImageUrl);
      var ldJsonScript = document.querySelector('script[type="application/ld+json"][data-dynamic-seo]');
      if (ldJsonScript) {
        ldJsonScript.textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "Trình tạo QR Code miễn phí",
          "url": canonicalHref,
          "description": "Tạo mã QR miễn phí cho liên kết, văn bản hoặc email với công cụ trực tuyến hỗ trợ tùy chỉnh màu sắc, kích thước và tải PNG ngay lập tức.",
          "inLanguage": "vi-VN",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "VND"
          }
        });
      }
    })();

    /*! QRCode generator (c) 2009 Kazuhiko Arase MIT License */
    (function() {
      function QR8bitByte(data) {
        this.mode = 1;
        this.data = data;
        this.parsedData = [];
        for (var i = 0; i < this.data.length; i++) {
          var byteArray = [];
          var code = this.data.charCodeAt(i);
          if (code > 0x10000) {
            byteArray[0] = 0xF0 | ((code & 0x1C0000) >>> 18);
            byteArray[1] = 0x80 | ((code & 0x3F000) >>> 12);
            byteArray[2] = 0x80 | ((code & 0xFC0) >>> 6);
            byteArray[3] = 0x80 | (code & 0x3F);
          } else if (code > 0x800) {
            byteArray[0] = 0xE0 | ((code & 0xF000) >>> 12);
            byteArray[1] = 0x80 | ((code & 0xFC0) >>> 6);
            byteArray[2] = 0x80 | (code & 0x3F);
          } else if (code > 0x80) {
            byteArray[0] = 0xC0 | ((code & 0x7C0) >>> 6);
            byteArray[1] = 0x80 | (code & 0x3F);
          } else {
            byteArray[0] = code;
          }
          this.parsedData = this.parsedData.concat(byteArray);
        }
        this.getLength = function() { return this.parsedData.length; };
        this.write = function(buffer) {
          for (var i = 0; i < this.parsedData.length; i++) {
            buffer.put(this.parsedData[i], 8);
          }
        };
      }

      var QRCodeModel = function(typeNumber, errorCorrectionLevel) {
        this.typeNumber = typeNumber;
        this.errorCorrectionLevel = resolveErrorCorrectionLevel(errorCorrectionLevel);
        this.modules = null;
        this.moduleCount = 0;
        this.dataCache = null;
        this.dataList = [];
      };

      QRCodeModel.prototype = {
        addData: function(data) {
          var newData = new QR8bitByte(data);
          this.dataList.push(newData);
          this.dataCache = null;
        },
        isDark: function(row, col) {
          if (this.modules[row][col] != null) {
            return this.modules[row][col];
          }
          return false;
        },
        getModuleCount: function() {
          return this.moduleCount;
        },
        make: function() {
          if (this.typeNumber < 1) {
            this.typeNumber = this._estimateTypeNumber();
          }
          this.makeImpl(false, this._getBestMaskPattern());
        },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (var row = 0; row < this.moduleCount; row++) {
            this.modules[row] = new Array(this.moduleCount);
            for (var col = 0; col < this.moduleCount; col++) {
              this.modules[row][col] = null;
            }
          }
          this._setupPositionProbePattern(0, 0);
          this._setupPositionProbePattern(this.moduleCount - 7, 0);
          this._setupPositionProbePattern(0, this.moduleCount - 7);
          this._setupPositionAdjustPattern();
          this._setupTimingPattern();
          this._setupTypeInfo(test, maskPattern);

          if (this.typeNumber >= 7) {
            this._setupTypeNumber(test);
          }

          if (this.dataCache == null) {
            this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectionLevel, this.dataList);
          }
          this._mapData(this.dataCache, maskPattern);
        },
        _setupPositionProbePattern: function(row, col) {
          for (var r = -1; r <= 7; r++) {
            if (row + r <= -1 || this.moduleCount <= row + r) continue;
            for (var c = -1; c <= 7; c++) {
              if (col + c <= -1 || this.moduleCount <= col + c) continue;
              if ((0 <= r && r <= 6 && (c === 0 || c === 6)) ||
                (0 <= c && c <= 6 && (r === 0 || r === 6)) ||
                (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        },
        _getBestMaskPattern: function() {
          var minLostPoint = 0;
          var bestPattern = 0;
          for (var pattern = 0; pattern < 8; pattern++) {
            this.makeImpl(true, pattern);
            var lostPoint = QRUtil.getLostPoint(this);
            if (pattern === 0 || minLostPoint > lostPoint) {
              minLostPoint = lostPoint;
              bestPattern = pattern;
            }
          }
          return bestPattern;
        },
        _setupTimingPattern: function() {
          for (var r = 8; r < this.moduleCount - 8; r++) {
            if (this.modules[r][6] != null) continue;
            this.modules[r][6] = (r % 2 === 0);
          }
          for (var c = 8; c < this.moduleCount - 8; c++) {
            if (this.modules[6][c] != null) continue;
            this.modules[6][c] = (c % 2 === 0);
          }
        },
        _setupPositionAdjustPattern: function() {
          var pos = QRUtil.getPatternPosition(this.typeNumber);
          for (var i = 0; i < pos.length; i++) {
            for (var j = 0; j < pos.length; j++) {
              var row = pos[i];
              var col = pos[j];
              if (this.modules[row][col] != null) continue;
              for (var r = -2; r <= 2; r++) {
                for (var c = -2; c <= 2; c++) {
                  this.modules[row + r][col + c] =
                    (r === -2 || r === 2 || c === -2 || c === 2 || (r === 0 && c === 0));
                }
              }
            }
          }
        },
        _setupTypeNumber: function(test) {
          var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
          for (var i = 0; i < 18; i++) {
            var mod = !test && ((bits >> i) & 1) === 1;
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        _setupTypeInfo: function(test, maskPattern) {
          var data = (this.errorCorrectionLevel.bits << 3) | maskPattern;
          var bits = QRUtil.getBCHTypeInfo(data);
          for (var i = 0; i < 15; i++) {
            var mod = !test && ((bits >> i) & 1) === 1;
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;
          }
          for (var j = 0; j < 15; j++) {
            var mod2 = !test && ((bits >> j) & 1) === 1;
            if (j < 8) this.modules[8][this.moduleCount - j - 1] = mod2;
            else if (j < 9) this.modules[8][15 - j - 1 + 1] = mod2;
            else this.modules[8][15 - j - 1] = mod2;
          }
          this.modules[this.moduleCount - 8][8] = !test;
        },
        _mapData: function(data, maskPattern) {
          var inc = -1;
          var row = this.moduleCount - 1;
          var bitIndex = 7;
          var byteIndex = 0;
          for (var col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col === 6) col--;
            while (true) {
              for (var c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  var dark = false;
                  if (byteIndex < data.length) {
                    dark = ((data[byteIndex] >>> bitIndex) & 1) === 1;
                  }
                  var mask = QRMaskPattern[maskPattern](row, col - c);
                  if (mask) dark = !dark;
                  this.modules[row][col - c] = dark;
                  bitIndex--;
                  if (bitIndex === -1) {
                    byteIndex++;
                    bitIndex = 7;
                  }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) {
                row -= inc;
                inc = -inc;
                break;
              }
            }
          }
        },
        _estimateTypeNumber: function() {
          for (var typeNum = 1; typeNum < 40; typeNum++) {

      if (contentType === "url") {
        payload = form.elements["url"].value.trim();
      } else if (contentType === "text") {
        payload = form.elements["text"].value.trim();
      } else if (contentType === "email") {
        const address = form.elements["emailAddress"].value.trim();
        const subject = form.elements["emailSubject"].value.trim();
        const body = form.elements["emailBody"].value.trim();
        const params = new URLSearchParams();
        if (subject) params.append("subject", subject);
        if (body) params.append("body", body);
        payload = "mailto:" + address + (params.toString() ? "?" + params.toString() : "");
      }

      if (!payload) {
        clearCanvas();
        downloadBtn.disabled = true;
        return;
      }

      try {
        drawQR(payload);
        downloadBtn.disabled = false;
      } catch (error) {
        if (force) {
          alert("Không thể tạo QR: " + error.message);
        }
        downloadBtn.disabled = true;
      }
    }

    function clearCanvas() {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawQR(text) {
      const fgColor = fgColorInput.value;
      const bgColor = bgColorInput.value;
      const size = Math.min(Math.max(parseInt(form.elements["size"].value, 10) || 320, 150), 800);
      const quietZone = parseInt(form.elements["margin"].value, 10) || 2;

      const qr = new QRCodeModel(-1, "M");
      qr.addData(text);
      qr.make();

      const moduleCount = qr.getModuleCount();
      const cellSize = Math.floor(size / (moduleCount + quietZone * 2));
      const actualSize = cellSize * (moduleCount + quietZone * 2);

      canvas.width = actualSize;
      canvas.height = actualSize;

      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, actualSize, actualSize);

      ctx.fillStyle = fgColor;
      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          if (qr.isDark(row, col)) {
            ctx.fillRect((col + quietZone) * cellSize, (row + quietZone) * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    setActiveContent("url");
  </script>
</body>
</html>
